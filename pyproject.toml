[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahf-ai"
version = "0.1.0"
description = "A unified Python library for AI text generation, summarization, translation, and classification with built-in safety filters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Applied Humanity Foundation", email = "dev@appliedhumanity.org" },
]
keywords = ["ai", "llm", "text-generation", "nlp", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "coverage>=7.0",
]

[project.scripts]
ahf-ai = "ahf_ai.cli:main"

[project.urls]
Homepage = "https://github.com/applied-humanity-foundation/ai-application-framework"
Documentation = "https://applied-humanity-foundation.github.io/ai-application-framework/"
Repository = "https://github.com/applied-humanity-foundation/ai-application-framework"

[tool.hatch.build.targets.wheel]
packages = ["python/ahf_ai"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
